<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Núcleo WIT — Front-End do Pokédex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,700..900&family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0810; --bg-1:#110e1b;
    --accent:#a78bfa; --accent-2:#c4b1ff; --accent-deep:#6d4ee0;
    --ink:#ece9f5; --muted:#a39bbd; --line:color-mix(in srgb, var(--accent) 24%, transparent);
    --ok:#5ee0a8;
    --font-display:"Archivo","Arial Black",system-ui,sans-serif;
    --font-body:"Sora",system-ui,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:var(--font-body)}
  #viewport{position:fixed;inset:0;display:grid;place-items:center;
    background:radial-gradient(1200px 700px at 80% -10%, #1c1633 0%, transparent 60%),
               radial-gradient(900px 600px at -5% 110%, #160f28 0%, transparent 55%), var(--bg-0);}
  #stage{width:1280px;height:720px;position:relative;transform-origin:center center;
    background:linear-gradient(160deg,var(--bg-1),var(--bg-0));overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.6);}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 200px rgba(0,0,0,.55);z-index:3}

  .slide{position:absolute;inset:0;padding:78px 96px 64px;opacity:0;visibility:hidden;
    transition:opacity .45s ease,visibility .45s;display:flex;flex-direction:column;z-index:1}
  .slide.active{opacity:1;visibility:visible;z-index:2}

  .bgfx{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bg-grid::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:48px 48px;opacity:.5;mask-image:radial-gradient(120% 110% at 60% 40%,#000 30%,transparent 92%);
    -webkit-mask-image:radial-gradient(120% 110% at 60% 40%,#000 30%,transparent 92%)}
  .bg-glow::before{content:"";position:absolute;width:780px;height:780px;border-radius:50%;
    right:-180px;top:-220px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent),transparent 65%)}
  .bg-diag::before{content:"";position:absolute;inset:0;opacity:.5;
    background:repeating-linear-gradient(-32deg,transparent 0 38px,var(--line) 38px 39px)}
  .bg-dots::before{content:"";position:absolute;inset:0;opacity:.6;
    background-image:radial-gradient(var(--line) 1.4px,transparent 1.5px);background-size:30px 30px;
    mask-image:radial-gradient(100% 100% at 30% 30%,#000,transparent 80%);
    -webkit-mask-image:radial-gradient(100% 100% at 30% 30%,#000,transparent 80%)}

  .topbar{position:absolute;top:34px;left:96px;right:96px;display:flex;align-items:center;justify-content:space-between;z-index:5}
  .brand{display:flex;align-items:center;gap:11px}
  .brand svg{width:26px;height:26px}
  .brand b{font-family:var(--font-display);font-weight:800;font-stretch:112%;letter-spacing:.5px;font-size:17px;color:var(--ink)}
  .kick{font-family:var(--font-mono);font-size:12px;letter-spacing:3px;color:var(--accent);text-transform:uppercase}
  .rule-top{position:absolute;top:58px;left:96px;right:96px;height:1px;background:var(--line);z-index:4}
  .counter{position:absolute;bottom:30px;right:96px;font-family:var(--font-mono);font-size:12px;letter-spacing:2px;color:var(--muted);z-index:5}
  .counter b{color:var(--accent)}
  .pbar{position:absolute;left:0;bottom:0;height:3px;width:0;transition:width .45s ease;z-index:6}

  .rv{opacity:0;transform:translateY(22px)}
  .slide.active .rv{animation:rise .62s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
  @keyframes rise{to{opacity:1;transform:none}}
  .hl{color:var(--accent-2);font-weight:600}

  h2.t{font-family:var(--font-display);font-weight:900;font-stretch:118%;text-transform:uppercase;
    color:var(--accent);line-height:.95;letter-spacing:-.5px}

  .cover{justify-content:center}
  .cover .lead{font-family:var(--font-mono);font-size:14px;letter-spacing:5px;color:var(--accent);text-transform:uppercase;margin-bottom:18px}
  .cover h1{font-family:var(--font-display);font-weight:900;font-stretch:125%;line-height:.88;font-size:104px;color:var(--accent);
    text-transform:uppercase;letter-spacing:-1px;max-width:1000px;text-shadow:0 0 60px color-mix(in srgb,var(--accent) 30%,transparent)}
  .cover .presenter{margin-top:40px;display:inline-flex;align-items:center;gap:14px;padding:13px 26px;border:1px solid var(--line);
    border-radius:999px;width:fit-content;font-family:var(--font-mono);font-size:14px;letter-spacing:2px;color:var(--ink)}
  .cover .presenter i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}

  .section{justify-content:center}
  .section .num{font-family:var(--font-display);font-weight:900;font-stretch:125%;font-size:160px;color:transparent;
    -webkit-text-stroke:2px var(--accent-deep);line-height:.8;opacity:.55}
  .section h2{font-size:80px;max-width:920px;color:var(--ink);font-family:var(--font-display);font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.95;margin-top:6px}
  .section .bar{width:80px;height:6px;background:var(--accent);margin-top:28px;border-radius:3px}

  .agenda{justify-content:center}
  .agenda h2{font-size:62px;color:var(--ink);margin-bottom:30px;font-family:var(--font-display);font-weight:900;font-stretch:122%;text-transform:uppercase}
  .agenda ul{list-style:none;max-width:820px}
  .agenda li{display:flex;align-items:baseline;gap:22px;padding:18px 4px;border-top:1px solid var(--line);font-size:26px;color:var(--ink)}
  .agenda li:last-child{border-bottom:1px solid var(--line)}
  .agenda li span{font-family:var(--font-mono);font-size:18px;color:var(--accent);min-width:42px}

  .dual h2.t{font-size:56px;margin-bottom:26px}
  .dual .blocks{display:flex;flex-direction:column;gap:18px;max-width:1000px}
  .blk{border-radius:16px;padding:24px 28px}
  .blk .lab{font-family:var(--font-mono);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:9px}
  .blk.formal{border:1px solid var(--line);background:rgba(255,255,255,.02)}
  .blk.formal .lab{color:var(--muted)}
  .blk.formal p{font-size:21px;line-height:1.45;color:var(--ink);font-weight:300}
  .blk.simple{background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
  .blk.simple .lab{color:var(--accent)}
  .blk.simple p{font-size:23px;line-height:1.4;color:var(--ink);font-weight:400}

  .aplica h2.t{font-size:54px;margin-bottom:28px}
  .aplica .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1}
  .vcol{border-radius:16px;padding:26px 28px;border:1px solid var(--line)}
  .vcol h3{font-family:var(--font-body);font-weight:600;font-size:23px;color:var(--ink);margin-bottom:16px;display:flex;align-items:center;gap:10px}
  .vcol h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .vcol.pro{background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .vcol ul{list-style:none;display:flex;flex-direction:column;gap:11px}
  .vcol li{font-size:18px;line-height:1.35;color:var(--muted);padding-left:20px;position:relative;font-weight:300}
  .vcol li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border:1.5px solid var(--accent);transform:rotate(45deg)}
  .vcol.pro li{color:var(--ink)}

  .steps h2.t{font-size:44px;margin-bottom:16px}
  .steps .row{display:flex;flex-direction:column;gap:9px;max-width:1030px}
  .step{display:flex;gap:18px;align-items:flex-start;padding:11px 20px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid var(--line)}
  .step .n{font-family:var(--font-display);font-weight:900;font-stretch:120%;font-size:32px;color:var(--accent);line-height:1.15;min-width:44px}
  .step .tx h4{font-size:18px;color:var(--ink);font-weight:600;margin-bottom:2px}
  .step .tx p{font-size:14.5px;color:var(--muted);font-weight:300;line-height:1.35}

  .briefing{justify-content:center}
  .brief-card{max-width:1010px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:20px;overflow:hidden;
    background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,transparent),rgba(255,255,255,.02))}
  .brief-head{display:flex;align-items:center;justify-content:space-between;padding:20px 30px;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .brief-head .ti{font-family:var(--font-mono);font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
  .badge{font-family:var(--font-display);font-weight:900;font-stretch:118%;font-size:30px;color:#0a0810;background:var(--accent);
    padding:6px 18px;border-radius:10px;letter-spacing:.5px}
  .brief-body{padding:30px 34px}
  .brief-body .quote{font-size:25px;line-height:1.5;color:var(--ink);font-weight:300}
  .brief-body .quote b{color:var(--accent-2);font-weight:600}
  .brief-foot{font-family:var(--font-mono);font-size:13px;letter-spacing:1px;color:var(--muted);margin-top:18px}

  .checklist h2.t{font-size:54px;margin-bottom:28px}
  .checklist ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1010px}
  .checklist li{display:flex;gap:16px;align-items:center;padding:18px 22px;border-radius:13px;border:1px solid var(--line);
    background:rgba(255,255,255,.02);font-size:20px;color:var(--ink)}
  .checklist li .ck{width:30px;height:30px;flex:0 0 auto;border-radius:8px;border:1.5px solid var(--accent);display:grid;place-items:center}
  .checklist li .ck svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2.4}

  .imageS{flex-direction:row;align-items:center;gap:50px}
  .imageS .col{flex:1;max-width:480px}
  .imageS h2.t{font-size:56px;margin-bottom:20px}
  .imageS p{font-size:21px;line-height:1.5;color:var(--ink);font-weight:300}
  .imageS .frame{flex:0 0 600px;height:400px;border-radius:18px;overflow:hidden;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
    box-shadow:0 0 50px color-mix(in srgb,var(--accent) 22%,transparent);position:relative;transform:rotate(-1.5deg)}
  .imageS .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .imageS .frame .ph{position:absolute;inset:0;display:grid;place-items:center;gap:10px;text-align:center;
    background:repeating-linear-gradient(135deg,rgba(255,255,255,.02) 0 14px,transparent 14px 28px);color:var(--muted)}
  .imageS .frame .ph b{font-family:var(--font-mono);font-size:14px;letter-spacing:2px;color:var(--accent)}
  .imageS .frame .ph small{font-size:13px;max-width:300px;line-height:1.4}

  /* WIDE — referência de site em tela cheia */
  .wide-full{position:absolute;inset:0;overflow:hidden}
  .wide-full img{width:100%;height:100%;object-fit:cover;display:block}
  .wide-full .ph-full{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;text-align:center;background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 14px,transparent 14px 28px);color:var(--muted)}
  .wide-full .ph-full b{font-family:var(--font-mono);font-size:14px;letter-spacing:2px;color:var(--accent)}
  .wide-full .fade{position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(10,8,16,.5) 0%, rgba(10,8,16,.05) 26%, rgba(10,8,16,.08) 56%, rgba(10,8,16,.97) 100%)}
  .wide-cap{position:absolute;left:96px;right:96px;bottom:54px}
  .wide-cap .wtag{font-family:var(--font-mono);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);
    display:inline-block;padding:6px 16px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.4);margin-bottom:16px}
  .wide-cap h2{font-size:50px;margin-bottom:12px}
  .wide-cap p{font-size:19px;line-height:1.5;color:var(--ink);font-weight:300;max-width:920px}
  .wide-cap .wlink{margin-top:18px;display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);
    font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);text-decoration:none;
    border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);padding:9px 18px;border-radius:999px;
    background:rgba(0,0,0,.4);transition:background .2s}
  .wide-cap .wlink:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
  .wide-cap .wlink svg{width:13px;height:13px;stroke:var(--accent);fill:none;stroke-width:2.2}

  .closing{justify-content:center}
  .closing h1{font-family:var(--font-display);font-weight:900;font-stretch:125%;font-size:104px;color:var(--accent);text-transform:uppercase;line-height:.9;
    text-shadow:0 0 60px color-mix(in srgb,var(--accent) 30%,transparent)}
  .closing p{margin-top:24px;font-size:24px;color:var(--ink);font-weight:300;max-width:760px;line-height:1.45}
  .closing p b{color:var(--accent-2);font-weight:600}

  .deco{position:absolute;pointer-events:none;z-index:0}
  .spark{stroke:var(--accent);stroke-width:2;fill:none}
  .spark.fill{fill:var(--accent);stroke:none;opacity:.9}

  #hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;font-family:var(--font-mono);font-size:12px;
    letter-spacing:1.5px;color:#6f6790;background:rgba(0,0,0,.4);padding:7px 16px;border-radius:999px;border:1px solid rgba(167,139,250,.15);transition:opacity .5s}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="hint">← →  NAVEGAR   ·   F  TELA CHEIA   ·   CLIQUE NA LATERAL TAMBÉM</div>
<script>
/* ============================================================
   NÚCLEO WIT — MOTOR DE SLIDES v2
   Edite SÓ o array DECK.
   ============================================================ */

const DECK = [
  { type:"cover", accent:"violet", bg:"glow",
    kick:"Aula · Front-End do Projeto Integrador",
    title:"Construindo a Interface do Pokédex",
    presenter:"Prof. Mayara · Núcleo WIT" },

  { type:"agenda", accent:"violet", bg:"grid", title:"O plano de hoje",
    items:[ ["01","O que é front-end (e o que não é)"], ["02","Onde isso vale além da sala"],
            ["03","Referências: os melhores exemplos do gênero"], ["04","O que o SEU site precisa ter"],
            ["05","Passo a passo: do ChatGPT ao front no ar"] ]},

  { type:"section", accent:"teal", bg:"dots", num:"01", title:"O que é Front-End" },

  { type:"dual", accent:"teal", bg:"grid",
    title:"O que é front-end?",
    formal:`É a parte de um sistema com que a pessoa <span class="hl">interage diretamente</span>:
            tudo que aparece na tela — botões, cores, texto, imagens — e como isso responde ao
            toque ou clique. O back-end é o motor escondido; o front-end é a carroceria e o painel.`,
    simple:`É o que o usuário vê e toca. Se o app trava, atrasa ou é bonito — o mérito (ou a culpa)
            é do front-end.` },

  { type:"aplica", accent:"amber", bg:"glow",
    title:"Onde isso vale além da aula",
    dia:["Todo app que você usa teve alguém desenhando aquela tela",
         "Vira senso crítico: você entende por que um site é bom ou ruim",
         "Você entende por que um app trava ou irrita — não é 'mania', é design ruim"],
    pro:["É profissão isolada — dá pra trabalhar só nisso, sem saber back-end",
         "Toda empresa com produto digital precisa de alguém pensando na interface",
         "É a parte mais rápida de mostrar num portfólio — resultado visual, prova imediata",
         "Freelas de landing page e protótipo pagam bem e usam exatamente essa habilidade"] },

  { type:"section", accent:"rose", bg:"diag", num:"02", title:"As Melhores Referências" },

  { type:"wide", accent:"violet", bg:"glow",
    tag:"landonorris.com — Awwwards Site of the Day",
    title:"O hero que grita uma coisa só",
    img:"https://assets.awwwards.com/awards/submissions/2025/10/68eb96833074e144081699.jpg",
    url:"https://landonorris.com/",
    body:`Um elemento domina a tela inteira — o nome, gigante. Tudo o resto é secundário. Essa é a
          decisão mais importante de um front-end: hierarquia. O olho tem que saber, sem pensar,
          o que olhar primeiro.` },

  { type:"wide", accent:"teal", bg:"glow",
    tag:"igloo.inc — Awwwards Site of the Day",
    title:"Scroll como narrativa",
    img:"https://assets.awwwards.com/awards/submissions/2024/06/6679694854f32131923081.jpg",
    url:"https://www.igloo.inc/",
    body:`Rolar a página conta uma história — cada seção se revela no tempo certo, com movimento
          que tem direção. Não é efeito por efeito: cada animação existe pra guiar o olhar pro
          próximo passo.` },

  { type:"checklist", accent:"amber", bg:"grid",
    title:"O que o SEU site PRECISA ter",
    items:["Botão de tirar ou enviar foto, bem visível","Resultado: nome da espécie + confiança",
           "Abas: Sobre, Onde encontrar, Habitat","Paleta e nome ligados ao SEU tema",
           "Álbum ou histórico do que já foi descoberto","Fonte e cor consistentes em toda tela"] },

  { type:"steps", accent:"rose", bg:"diag",
    title:"Anatomia de uma boa interface",
    steps:[
      ["1","Hierarquia visual","O olho tem que saber o que olhar primeiro. O resultado da identificação é sempre o maior elemento da tela."],
      ["2","Cor com propósito","Cada cor comunica o tema — verde pra plantas, azul pra peixes. Não é 'deixar bonito', é comunicar."],
      ["3","Tipografia","No máximo duas fontes: uma pro título, outra pro texto. Fonte errada quebra a credibilidade na hora."],
      ["4","Espaço em branco","Espaço vazio não é desperdício — é o que deixa o conteúdo respirar. Site apertado parece amador."] ]},

  { type:"section", accent:"violet", bg:"dots", num:"03", title:"Mão na Massa: ChatGPT" },

  { type:"steps", accent:"violet", bg:"grid",
    title:"Passo a passo: do login ao front no ar",
    steps:[
      ["1","Crie sua conta","Acesse chat.com, clique em 'Sign up' e entre com Google ou e-mail. É grátis, não pede cartão."],
      ["2","Abra uma conversa nova","Clique em '+ New chat'. Cada conversa é isolada — comece do zero pro projeto de vocês."],
      ["3","Descreva o front-end inteiro","Um prompt só, bem específico: estrutura da tela, o tema, a paleta, os itens do checklist da aula anterior."],
      ["4","Peça o formato certo","Peça 'em HTML, CSS e JS num arquivo só, sem framework' — assim roda direto no navegador, sem instalar nada."],
      ["5","Copie, salve e teste","Cole o código num arquivo .html, salve e dê duplo clique pra abrir no Chrome. Deu erro? Cole a mensagem de volta no chat."] ]},

  { type:"dual", accent:"amber", bg:"glow",
    title:"Outra IA gratuita pra comparar",
    formal:`<span class="hl">Google AI Studio</span> (aistudio.google.com) também gera código a
            partir de um prompt, de graça, sem cartão — só entrar com uma conta Google.`,
    simple:`Mesma ideia do ChatGPT, site diferente. Testem o MESMO prompt nos dois e comparem
            qual interpretou melhor o pedido de vocês.` },

  { type:"closing", accent:"violet", bg:"glow",
    title:"Agora é a vez de vocês",
    sub:`Com essas referências e o passo a passo na mão, montem o front-end do <b>seu tema</b>.
         Próxima aula: cada um mostra o que saiu.` },
];

/* ---------- paletas / fundos ---------- */
const PAL={
  violet:["#a78bfa","#c4b1ff","#6d4ee0"], teal:["#4fd6c0","#8af0e2","#1f9e8c"],
  amber:["#f0b24a","#ffd591","#c8861f"], rose:["#ff7a9c","#ffb3c4","#d44d70"],
  lime:["#b6e34f","#d8f59a","#7fae1f"],
};
function accentStyle(a){const p=PAL[a]||PAL.violet;return `--accent:${p[0]};--accent-2:${p[1]};--accent-deep:${p[2]};`;}

const MARK=`<svg viewBox="0 0 32 32">${[0,45,90,135,180,225,270,315].map(a=>
  `<rect x="14.4" y="2" width="3.2" height="11" rx="1.6" fill="var(--accent)" transform="rotate(${a} 16 16)"/>`).join("")}
  <circle cx="16" cy="16" r="2.4" fill="var(--accent-2)"/></svg>`;
function spark(x,y,s,f){return `<svg class="deco" style="left:${x}px;top:${y}px" width="${s}" height="${s}" viewBox="-12 -12 24 24">
  <path class="spark ${f?'fill':''}" d="M0,-11 C1.4,-4 4,-1.4 11,0 C4,1.4 1.4,4 0,11 C-1.4,4 -4,1.4 -11,0 C-4,-1.4 -1.4,-4 0,-11 Z"/></svg>`;}
const CK=`<svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>`;

function chrome(d,i,n){
  const k=d.kick||(d.type==="cover"?"Núcleo WIT":d.label||d.title||"");
  return `<div class="topbar"><div class="brand">${MARK}<b>Núcleo WIT</b></div><div class="kick">${k}</div></div>
    <div class="rule-top"></div><div class="counter"><b>${String(i+1).padStart(2,"0")}</b> / ${String(n).padStart(2,"0")}</div>`;}

function body(d){
  switch(d.type){
    case "cover": return `${spark(1040,120,46)}${spark(1130,210,30,true)}${spark(170,150,40)}${spark(120,560,34)}${spark(1150,560,38,true)}
      <div class="cover" style="height:100%"><div class="lead rv" style="--d:.05s">${d.kick}</div>
      <h1 class="rv" style="--d:.16s">${d.title}</h1>
      <div class="presenter rv" style="--d:.34s"><i></i>${d.presenter}</div></div>`;
    case "agenda": return `<div class="agenda" style="height:100%"><h2 class="rv" style="--d:.05s">${d.title}</h2>
      <ul>${d.items.map((it,j)=>`<li class="rv" style="--d:${.15+j*.09}s"><span>${it[0]}</span>${it[1]}</li>`).join("")}</ul></div>`;
    case "section": return `${spark(1080,140,42)}${spark(150,540,36,true)}
      <div class="section" style="height:100%"><div class="num rv" style="--d:.05s">${d.num}</div>
      <h2 class="rv" style="--d:.18s">${d.title}</h2><div class="bar rv" style="--d:.34s"></div></div>`;
    case "dual": return `<div class="dual" style="height:100%;justify-content:center;display:flex;flex-direction:column">
      <h2 class="t rv" style="--d:.05s">${d.title}</h2><div class="blocks">
      <div class="blk formal rv" style="--d:.16s"><div class="lab">A definição completa</div><p>${d.formal}</p></div>
      <div class="blk simple rv" style="--d:.3s"><div class="lab">Traduzindo</div><p>${d.simple}</p></div></div></div>`;
    case "aplica": return `<div class="aplica" style="height:100%;display:flex;flex-direction:column">
      <h2 class="t rv" style="--d:.05s">${d.title}</h2><div class="cols">
      <div class="vcol rv" style="--d:.16s"><h3><span class="dot"></span>No dia a dia</h3><ul>${d.dia.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div class="vcol pro rv" style="--d:.28s"><h3><span class="dot"></span>No mundo profissional</h3><ul>${d.pro.map(x=>`<li>${x}</li>`).join("")}</ul></div></div></div>`;
    case "steps": return `<div class="steps" style="height:100%;justify-content:center;display:flex;flex-direction:column">
      <h2 class="t rv" style="--d:.05s">${d.title}</h2><div class="row">${d.steps.map((s,j)=>
      `<div class="step rv" style="--d:${.16+j*.1}s"><div class="n">${s[0]}</div><div class="tx"><h4>${s[1]}</h4><p>${s[2]}</p></div></div>`).join("")}</div></div>`;
    case "image": {const f=d.img?`<img src="${d.img}" alt="" onerror="this.parentElement.innerHTML='<div class=&quot;ph&quot;><b>[ imagem indisponível ]</b><small>${(d.imgHint||"").replace(/'/g,"")}</small></div>'">`:`<div class="ph"><b>[ imagem ao vivo ]</b><small>${d.imgHint||"cole uma imagem aqui"}</small></div>`;
      return `<div class="imageS" style="height:100%"><div class="col"><h2 class="t rv" style="--d:.06s">${d.title}</h2>
      <p class="rv" style="--d:.2s">${d.body}</p></div><div class="frame rv" style="--d:.3s">${f}</div></div>`;}
    case "wide": return `<div class="wide-full">
      <img src="${d.img}" alt="" onerror="this.style.display='none';this.parentElement.querySelector('.ph-full').style.display='flex'">
      <div class="ph-full"><b>[ imagem indisponível ]</b><small>${d.tag||""}</small></div>
      <div class="fade"></div>
      <div class="wide-cap rv" style="--d:.15s">
        <span class="wtag">${d.tag||""}</span>
        <h2 class="t">${d.title}</h2>
        <p>${d.body}</p>
        ${d.url?`<a class="wlink" href="${d.url}" target="_blank" rel="noopener noreferrer">Abrir site
          <svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></a>`:""}
      </div></div>`;
    case "briefing": return `${spark(1100,150,40)}${spark(150,540,30,true)}
      <div class="briefing" style="height:100%"><div class="brief-card rv" style="--d:.1s">
      <div class="brief-head"><div class="ti">${d.label}</div><div class="badge">${d.budget}</div></div>
      <div class="brief-body"><div class="quote">${d.quote}</div><div class="brief-foot">${d.foot}</div></div></div></div>`;
    case "checklist": return `<div class="checklist" style="height:100%;justify-content:center;display:flex;flex-direction:column">
      <h2 class="t rv" style="--d:.05s">${d.title}</h2><ul>${d.items.map((x,j)=>
      `<li class="rv" style="--d:${.14+j*.07}s"><span class="ck">${CK}</span>${x}</li>`).join("")}</ul></div>`;
    case "closing": return `${spark(1080,150,46)}${spark(1170,250,30,true)}${spark(180,180,38)}
      <div class="closing" style="height:100%"><h1 class="rv" style="--d:.05s">${d.title}</h1>
      <p class="rv" style="--d:.28s">${d.sub}</p></div>`;
  }
  return "";
}

const stage=document.getElementById("stage");
stage.insertAdjacentHTML("beforeend",`<div class="pbar"></div>`);
DECK.forEach((d,i)=>stage.insertAdjacentHTML("beforeend",
  `<section class="slide" data-i="${i}" style="${accentStyle(d.accent)}">
     <div class="bgfx bg-${d.bg||'grid'}"></div>${chrome(d,i,DECK.length)}${body(d)}</section>`));
const slides=[...stage.querySelectorAll(".slide")], pbar=stage.querySelector(".pbar");
let cur=0;
function show(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle("active",i===cur));
  const a=getComputedStyle(slides[cur]).getPropertyValue("--accent");
  pbar.style.background=`linear-gradient(90deg, color-mix(in srgb,${a} 60%,#000), ${a})`;
  pbar.style.boxShadow=`0 0 14px ${a}`; pbar.style.width=((cur+1)/slides.length*100)+"%";}
const next=()=>show(cur+1), prev=()=>show(cur-1);
document.addEventListener("keydown",e=>{
  if(["ArrowRight"," ","PageDown"].includes(e.key)){e.preventDefault();next();}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==="Home")show(0); else if(e.key==="End")show(slides.length-1);
  else if(e.key.toLowerCase()==="f"){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();}});
let lc=0;
document.getElementById("viewport").addEventListener("click",e=>{
  if(Date.now()-lc<280)return;lc=Date.now();
  if(e.clientX<innerWidth*0.18)prev();else next();});
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`scale(${s})`;}
addEventListener("resize",fit);fit();show(0);
setTimeout(()=>document.getElementById("hint").style.opacity="0",4200);
addEventListener("mousemove",()=>{const h=document.getElementById("hint");h.style.opacity=".7";clearTimeout(h._t);h._t=setTimeout(()=>h.style.opacity="0",2500);});
</script>
</body>
</html>
